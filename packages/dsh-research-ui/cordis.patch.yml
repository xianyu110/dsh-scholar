# DSH Research OS — standalone GUI plugin bundle (design E7).
# Registers the host half (kernel sidecar + /research-ui-api bridge); the
# browser half is auto-discovered via dshClient exports["./client"].
- insert:
    - id: research-ui
      name: '@dsh-scholar/research-ui'
      config:
        kernel:
          host: 127.0.0.1
          # Share the main plugin's kernel when installed together (reuse
          # logic makes this a no-op), or pick an isolated port otherwise.
          port: 7412
