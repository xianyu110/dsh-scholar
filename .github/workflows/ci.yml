name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build core packages
        run: |
          pnpm --filter @dsh-scholar/research-schemas run build
          pnpm -r run build
      - name: Unit tests (schemas / kernel / connectors / runner)
        run: pnpm test
      - name: Fault-injection tests (kill -9 recovery, leases, idempotency)
        run: bash tests/fault-injection/run-fault-tests.sh
      - name: Golden-path e2e (kernel + runner + gates + ledger + manuscript)
        run: bash tests/e2e/golden-path.sh

  plugin-typecheck:
    # Typechecks the DSH plugin surface against a DSH source checkout. The
    # @deepseek-ai/* packages are not on the npm registry; this job needs a
    # checkout at DSH_SCHOLAR_DSH_ROOT (repo secret), else it is skipped.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ vars.DSH_SCHOLAR_DSH_ROOT != '' || secrets.DSH_SCHOLAR_DSH_ROOT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lzszq/dsh-scholar-dsh-source
          path: dsh-source
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Link DSH types and typecheck the plugin
        run: |
          bash scripts/link-dsh-deps.sh "$PWD/dsh-source"
          pnpm run typecheck
