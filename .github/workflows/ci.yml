# CI — v0.2 hardening matrix (Ticket SCH-CI-001, §19.4 / §24.1).
#
# All jobs below are MANDATORY and blocking: no job is skipped by default
# (no secret-conditional `if`), so every Workflow Run has real jobs and a
# `main`/`hardening/v0.2` run that is not fully green blocks the release.
#
# Why @dsh-scholar/research-ui is excluded from the standalone builds:
# packages/dsh-research-ui/src/host/bridge.ts type-imports
# `@deepseek-ai/dsh-host-webserver`, and the plugin barrel (src/plugin) plus
# the root package build need a DSH source checkout for the @deepseek-ai/*
# types (not on the npm registry). Only the plugin-typecheck job has access
# to such a checkout (DSH_SCHOLAR_DSH_ROOT secret); every other job builds
# the six standalone packages/workers whose outputs (kernel + runner) feed
# all tests and evals, and runs the unit suite that does not import the
# plugin barrel.
#
# tests/unit/security.test.ts imports `@dsh-scholar/research-plugin`
# (root package, main: lib/index.js) which runtime-imports
# @deepseek-ai/dsh-skill-local; it can only load when the root plugin is
# built, i.e. when a DSH checkout is available. It is therefore excluded
# from the standalone unit step; its §19.2 security coverage is exercised
# kernel-level by the security-blocking job (run-hardening-tests.sh +
# run-all-v2-blocking-tests.sh), which is a blocking job.

name: CI

on:
  push:
    branches: [main, hardening/v0.2]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build standalone sub-packages
        run: |
          pnpm -r --filter './packages/*' --filter './workers/*' --filter '!@dsh-scholar/research-ui' run build
      - name: Unit tests
        run: |
          pnpm exec vitest run --exclude tests/unit/security.test.ts
      - name: Fault-injection tests (kill -9 recovery, leases, idempotency)
        run: bash tests/fault-injection/run-fault-tests.sh

  security-blocking:
    needs: unit-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build standalone sub-packages
        run: |
          pnpm -r --filter './packages/*' --filter './workers/*' --filter '!@dsh-scholar/research-ui' run build
      - name: §19.2 P0 hardening tests (host-exec / fake-experiment defenses)
        run: bash tests/security/run-hardening-tests.sh
      - name: §19.2 v2 blocking tests (isolation / evidence / manifest / gates / unicode)
        run: bash tests/security/run-all-v2-blocking-tests.sh

  docker-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build standalone sub-packages
        run: |
          pnpm -r --filter './packages/*' --filter './workers/*' --filter '!@dsh-scholar/research-ui' run build
      - name: Runner docker-mode eval (§4.6.1, blocking)
        run: bash evals/docker-eval.sh

  golden-path-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build standalone sub-packages
        run: |
          pnpm -r --filter './packages/*' --filter './workers/*' --filter '!@dsh-scholar/research-ui' run build
      - name: Golden Path v2 real-execution eval (§19.3, blocking)
        run: bash evals/golden-path-v2/run-golden-v2.sh

  clean-room:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build standalone sub-packages
        run: |
          pnpm -r --filter './packages/*' --filter './workers/*' --filter '!@dsh-scholar/research-ui' run build
      - name: Clean-room rerun (§13.1 / §4.8.6, blocking)
        run: bash evals/clean-room-rerun.sh
      - name: Golden-path e2e (kernel + runner + gates + ledger + manuscript; docker)
        run: bash tests/e2e/golden-path.sh

  typecheck-plugin:
    # Optional (not part of the mandatory matrix): typechecks the DSH plugin
    # surface against a real DSH source checkout. The @deepseek-ai/* packages
    # are not on the npm registry, so this job needs a checkout at
    # DSH_SCHOLAR_DSH_ROOT (repo secret); without it the job is skipped and
    # the mandatory matrix above still covers build + unit + security +
    # docker + golden-path + clean-room.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ vars.DSH_SCHOLAR_DSH_ROOT != '' || secrets.DSH_SCHOLAR_DSH_ROOT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lzszq/dsh-scholar-dsh-source
          path: dsh-source
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Link DSH types and typecheck the plugin
        run: |
          bash scripts/link-dsh-deps.sh "$PWD/dsh-source"
          pnpm run typecheck
